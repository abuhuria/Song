<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do you like me? ❤️</title>
  
  <!-- Premium Romantic Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* -------------------------------------------------------------------------- */
    /* 1. CSS VARIABLES & RESET                                                   */
    /* -------------------------------------------------------------------------- */
    :root {
      --bg-gradient-1: #ffafbd;
      --bg-gradient-2: #ffc3a0;
      --bg-gradient-3: #ffc0cb;
      --card-bg: rgba(255, 255, 255, 0.45);
      --card-border: rgba(255, 255, 255, 0.4);
      --primary-red: #ff4d6d;
      --dark-red: #c9184a;
      --pink-glow: #ff85a1;
      --text-main: #4a0e17;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3), #ffe5ec);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      position: relative;
    }

    /* -------------------------------------------------------------------------- */
    /* 2. BACKGROUND ANIMATIONS (Gradient & Floating Elements)                    */
    /* -------------------------------------------------------------------------- */
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* -------------------------------------------------------------------------- */
    /* 3. GLASSMORPHISM MAIN CARD                                                 */
    /* -------------------------------------------------------------------------- */
    .card-container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 440px;
      padding: 3rem 2rem;
      background: var(--card-bg);
      backdrop-filter: blur(16px) saturate(120%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(255, 77, 109, 0.15),
                  inset 0 1px 0 var(--card-border);
      text-align: center;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* -------------------------------------------------------------------------- */
    /* 4. INTERACTIVE STATE: QUESTION VIEW                                        */
    /* -------------------------------------------------------------------------- */
    .heart-icon-wrap {
      margin-bottom: 1.5rem;
    }

    .heart-main {
      font-size: 4.5rem;
      display: inline-block;
      animation: heartbeat 1.2s infinite cubic-bezier(0.215, 0.610, 0.355, 1);
      filter: drop-shadow(0 0 15px rgba(255, 77, 109, 0.6));
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      20% { transform: scale(1.25); }
      40% { transform: scale(1.1); }
      60% { transform: scale(1.3); }
      80% { transform: scale(1); }
      100% { transform: scale(1); }
    }

    .title {
      font-family: 'Pacifico', cursive;
      font-size: 2.5rem;
      color: var(--dark-red);
      margin-bottom: 1rem;
      background: linear-gradient(45deg, var(--dark-red), var(--primary-red));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 8px rgba(255, 77, 109, 0.3));
    }

    .subtitle {
      font-size: 0.95rem;
      color: #723c43;
      margin-bottom: 2.5rem;
      letter-spacing: 0.5px;
    }

    /* Buttons Configuration */
    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 60px;
      position: relative;
    }

    .btn {
      padding: 0.85rem 2rem;
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-yes {
      background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
      color: white;
      box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4);
      z-index: 11;
    }

    .btn-yes:hover {
      box-shadow: 0 12px 25px rgba(255, 77, 109, 0.6);
      transform: translateY(-2px);
    }

    /* Smart escaping NO button styling */
    .btn-no {
      background: white;
      color: #555;
      border: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.05);
      position: relative;
      z-index: 12;
      transition: transform 0.4s cubic-bezier(0.25, 1.5, 0.5, 1);
      will-change: transform;
    }

    /* -------------------------------------------------------------------------- */
    /* 5. INTERACTIVE STATE: CELEBRATION VIEW                                     */
    /* -------------------------------------------------------------------------- */
    .celebration-content {
      display: none;
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .celebration-content.active {
      display: block;
      opacity: 1;
      transform: scale(1);
    }

    .premium-msg {
      font-family: 'Pacifico', cursive;
      font-size: 2.5rem;
      color: var(--dark-red);
      margin-bottom: 1rem;
      background: linear-gradient(45deg, var(--dark-red), var(--primary-red));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 8px rgba(255, 77, 109, 0.3));
    }

    .sub-msg {
      font-family: 'Great Vibes', cursive;
    font-size: 2.0rem;
    color: #ff5c8d;
    text-align: center;
    text-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
    }

    .bouncing-heart {
  font-size: 3.6rem;
  display: inline-block;
  margin-top: 27px; /* নিচে নামানোর পরিমাণ */
  animation: bounce 2s infinite ease-in-out;
}

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.15); }
    }
  </style>
</head>
<body>


<button id="startMusic" style="
position:fixed;
opacity:0;
pointer-events:none;
">
Start
</button>



  
  <!-- Dynamic Background Matrix (Particles & Floating Hearts) -->
  <canvas id="bg-canvas"></canvas>

  <canvas id="bg-canvas"></canvas>


<audio id="openSong" preload="auto">
  <source src="https://github.com/abuhuria/Song/raw/refs/heads/main/Lyrical___Saiyaara_Title_Song___Ahaan,_Aneet___Tanishk_Bagchi,_Faheem_Abdullah,_Arslan__Irshad_Kamil(256k).mp3" type="audio/mpeg">
</audio>


  

<audio id="yesSong" preload="auto">
  <source src="https://github.com/abuhuria/Song/raw/refs/heads/main/ARZ_KIYA_HAI__Lyrics__-_Anuv_Jain___With_Translation___Coke_Studio___Anuv_Jain_New_Song(256k).mp3" type="audio/mpeg">
</audio>


  

  <!-- Interactive Card Structure -->
  <div class="card-container" id="main-card">
    
    <!-- Step 1: Default Question UI -->
    <div id="question-view">
      <div class="heart-icon-wrap">
        <span class="heart-main">❤️</span>
      </div>
      <h1 class="title">Do you wanna meet with me? 🥀</h1>
      <p class="subtitle">Choose honestly...</p>
      
      <div class="btn-group" id="btn-zone">
        <button class="btn btn-yes" id="yes-trigger">YES ❤️‍🔥</button>
        <button class="btn btn-no" id="no-trigger">💔 NO</button>
      </div>
    </div>

    <!-- Step 2: Hidden Celebration UI -->
    <div id="celebration-view" class="celebration-content">
      <h1 class="premium-msg">Thanks pretty ❣️</h1>
      <p class="sub-msg">Let's meet with video call. 💕</p>
      <div class="bouncing-heart">💓</div>
    </div>

  </div>

  <script>
    /* -------------------------------------------------------------------------- */
    /* 1. BACKGROUND CANVAS ENGINE (Hearts & Floating Sparkles)                    */
    /* -------------------------------------------------------------------------- */
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    let particlesArray = [];
    const colors = ['#ff4d6d', '#ff758f', '#ff85a1', '#fbb1bd', '#ffffff'];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
        // Stagger initial distribution across the full canvas height
        this.y = Math.random() * canvas.height;
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + 20;
        this.size = Math.random() * 12 + 4;
        this.speedY = Math.random() * 1.5 + 0.5;
        this.speedX = Math.sin(Math.random() * 2) * 0.5;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.type = Math.random() > 0.4 ? 'heart' : 'sparkle';
        this.opacity = Math.random() * 0.6 + 0.2;
        this.rotation = Math.random() * Math.PI;
        this.rotationSpeed = Math.random() * 0.02 - 0.01;
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        this.rotation += this.rotationSpeed;
        if (this.y < -20 || this.x < -20 || this.x > canvas.width + 20) {
          this.reset();
        }
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.fillStyle = this.color;

        if (this.type === 'heart') {
          ctx.beginPath();
          // Precise pathing for vector style background hearts
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-this.size / 2, -this.size / 2, -this.size, this.size / 3, 0, this.size);
          ctx.bezierCurveTo(this.size, this.size / 3, this.size / 2, -this.size / 2, 0, 0);
          ctx.fill();
        } else {
          // Standard glowing sparkling particles
          ctx.beginPath();
          ctx.arc(0, 0, this.size / 3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function initParticles() {
      particlesArray = [];
      const density = Math.floor((canvas.width * canvas.height) / 15000);
      const targetCount = Math.min(Math.max(density, 30), 80);
      for (let i = 0; i < targetCount; i++) {
        particlesArray.push(new Particle());
      }
    }
    initParticles();

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update();
        particlesArray[i].draw();
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* -------------------------------------------------------------------------- */
    /* 2. THE ESCAPING "NO" BUTTON SYSTEM (Mathematical Proximity Avoidance)       */
    /* -------------------------------------------------------------------------- */
    const noBtn = document.getElementById('no-trigger');
    const card = document.getElementById('main-card');
    
    // Positional matrices tracking current offsets
    let currentX = 0;
    let currentY = 0;
    const padding = 25; 
    const detectionRadius = 90; // The perimeter of approach before escape vectors launch

    function getAbsoluteRect(element) {
      const rect = element.getBoundingClientRect();
      return {
        left: rect.left + window.scrollX,
        top: rect.top + window.scrollY,
        width: rect.width,
        height: rect.height,
        right: rect.right + window.scrollX,
        bottom: rect.bottom + window.scrollY
      };
    }

    function handleProximity(e) {
      let clientX, clientY;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      const noRect = noBtn.getBoundingClientRect();
      const noCenterX = noRect.left + noRect.width / 2;
      const noCenterY = noRect.top + noRect.height / 2;

      // Calculate real-time trigonometric vector distance
      const distance = Math.hypot(clientX - noCenterX, clientY - noCenterY);

      if (distance < detectionRadius) {
        escape(clientX, clientY);
      }
    }

    function escape(targetX, targetY) {
      const noRect = noBtn.getBoundingClientRect();
      const cardRect = card.getBoundingClientRect();

      // Viewport dimensional envelopes
      const vWidth = window.innerWidth;
      const vHeight = window.innerHeight;

      // Safe deployment coordinates mapping (keeps button visible inside viewport bounds)
      const minX = padding;
      const maxX = vWidth - noRect.width - padding;
      const minY = padding;
      const maxY = vHeight - noRect.height - padding;

      let validTarget = false;
      let newAbsX = 0;
      let newAbsY = 0;
      let attempts = 0;

      // Optimization loop calculating valid non-overlapping escaping coordinates
      while (!validTarget && attempts < 50) {
        attempts++;
        newAbsX = minX + Math.random() * (maxX - minX);
        newAbsY = minY + Math.random() * (maxY - minY);

        // Buffer ensuring new location doesn't land directly on the cursor
        const distToCursor = Math.hypot(newAbsX + noRect.width/2 - targetX, newAbsY + noRect.height/2 - targetY);
        
        // Dynamic clearance keeping the button from centering overlapping the main card
        const horizontalOverlap = (newAbsX + noRect.width > cardRect.left - 10) && (newAbsX < cardRect.right + 10);
        const verticalOverlap = (newAbsY + noRect.height > cardRect.top - 10) && (newAbsY < cardRect.bottom + 10);
        const overlapsCardExcessively = horizontalOverlap && verticalOverlap;

        if (distToCursor > 120 && !overlapsCardExcessively) {
          validTarget = true;
        }
      }

      // Transform absolute coordinate space back to relative local transform matrix offsets
      const initialRect = noBtn.parentElement.getBoundingClientRect();
      const defaultLeft = noBtn.offsetLeft + initialRect.left;
      const defaultTop = noBtn.offsetTop + initialRect.top;

      currentX = newAbsX - (noBtn.offsetLeft + initialRect.left);
      currentY = newAbsY - (noBtn.offsetTop + initialRect.top);

      noBtn.style.transform = `translate(${currentX}px, ${currentY}px)`;
    }

    // Bind event systems for cross-device touch and standard cursors
    window.addEventListener('mousemove', handleProximity);
    window.addEventListener('touchmove', handleProximity, { passive: true });
    noBtn.addEventListener('mouseenter', () => escape(window.innerWidth/2, window.innerHeight/2));

    /* -------------------------------------------------------------------------- */
    /* 3. CELEBRATION DISPATCH ENGINE (YES Interactions)                          */
    /* -------------------------------------------------------------------------- */
    const yesBtn = document.getElementById('yes-trigger');
    const questionView = document.getElementById('question-view');
    const celebrationView = document.getElementById('celebration-view');


window.addEventListener("load", () => {

  const openSong = document.getElementById("openSong");

  openSong.currentTime = 115; // 1:55 থেকে শুরু
  openSong.volume = 0.8;

  openSong.play()
  .then(() => {
    console.log("Opening song playing");
  })
  .catch(() => {
    console.log("Autoplay blocked by browser");
  });


  // 10 seconds পরে stop
  setTimeout(() => {
    openSong.pause();
    openSong.currentTime = 115;
  }, 10000);

});


    

    yesBtn.addEventListener('click', () => {

  const openSong = document.getElementById("openSong");
  const yesSong = document.getElementById("yesSong");


  // Opening song বন্ধ
  openSong.pause();
  openSong.currentTime = 0;


  // YES song চালু
  yesSong.currentTime = 225;
  yesSong.volume = 0.8;
  yesSong.play();

  // 20 seconds পরে বন্ধ হবে
  setTimeout(() => {
    song.pause();
    song.currentTime = 0;
  }, 11000);


  window.removeEventListener('mousemove', handleProximity);
  window.removeEventListener('touchmove', handleProximity);

  questionView.style.opacity = '0';

  setTimeout(() => {
    questionView.style.display = 'none';
    celebrationView.style.display = 'block';

    celebrationView.offsetHeight;
    celebrationView.classList.add('active');

  }, 400);

  

  // Heart explosion
  triggerCelebrationBlast();
});

    function triggerCelebrationBlast() {
      const totalBlastElements = 120;
      
      // Override current background matrices to generate explicit dense explosions centered on viewport
      for (let i = 0; i < totalBlastElements; i++) {
        setTimeout(() => {
          const p = new Particle();
          p.x = window.innerWidth / 2;
          p.y = window.innerHeight / 2 + 50;
          
          // Radial explosive trajectory configuration
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 8 + 4;
          
          p.speedX = Math.cos(angle) * speed;
          p.speedY = Math.sin(angle) * speed * -1; // Force inverted vertical vectors
          p.size = Math.random() * 16 + 8;
          p.opacity = 1;
          
          particlesArray.push(p);
        }, Math.random() * 200);
      }
    }


          
  </script>
</body>
